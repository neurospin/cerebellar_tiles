# ============================================================================
# Snakemake profile — TGCC / Flux via cluster-generic
#
# DEPLOY TO:
#   ${ROOT}/cerebellar_tiles/profiles/tgcc-flux/config.yaml
#   ROOT=${ROOT}
#
# ADAPTED FROM the existing `profiles/tgcc` config. Same executor
# (cluster-generic) — only the submit/status commands change:
#
#   tgcc  : python .../tgcc_submit.py   -> ccc_msub -> central Bridge/Slurm
#   flux  : flux submit                 -> nested Flux instance (#MSUB -F)
#
# The native snakemake-executor-plugin-flux is NOT used: it needs `import flux`
# inside Snakemake's interpreter (python 3.11.4), but TGCC ships flux bindings
# for python 3.6 only. 
#
# REQUIRES in the sub_file:
#   #MSUB -F        <- starts the nested Flux instance. Without it, nothing works.
#   #MSUB -c <N>    <- the whole Flux core budget; all work runs INSIDE it.
# ============================================================================

executor: cluster-generic

# --- submission -------------------------------------------------------------
# cluster-generic appends the generated jobscript path, hence the trailing
# `bash` (runs the jobscript explicitly rather than relying on its exec bit).
# Note there is no partition / qos / project / filesystem here: under Flux the
# allocation is already fixed by the sub_file, so those resources (which
# tgcc_submit.py consumes) have no meaning on this route.
#
# NO `--setattr=system.duration`. It would be fed
# {resources.runtime}, which Snakemake DERIVES for a group job from its members.
# The per-subject group is ~15 topological layers deep, so that value comes out
# either as a sum (~9000 s -> flux may park or refuse the job once the
# allocation has less time left) or as a max (600 s -> the chain is killed
# mid-way). Both fail quietly and expensively, and inside a private nested Flux
# instance owned by this one workflow the allocation wall already bounds
# everything.
# If you want hang protection back, use a CONSTANT, never a derived value:
#   --setattr=system.duration=7200
cluster-generic-submit-cmd: >-
  flux submit -n1 -c{threads}
  --job-name=smk-{rule} bash

# Cached status command: ONE `flux jobs -a` snapshot per TTL, shared by every
# check, instead of 1-2 `flux jobs` python-CLI calls PER check (~1.5 s each).
# cluster-generic polls active jobs SERIALLY, so in-flight jobs equilibrate at
# N ~= T_job / t_poll. That ~1.5 s poll is what capped job 5290272 at N~12 with
# 2040 cores idle for 4h20. Keep flux_status.sh alongside it for rollback.
cluster-generic-status-cmd: bash ${ROOT}/cerebellar_tiles/profiles/tgcc-flux/flux_status_cached.sh
cluster-generic-cancel-cmd: flux cancel

# --- concurrency ------------------------------------------------------------
# HARD RULE: jobs x threads <= the #MSUB -c budget, with headroom.
#
# Flux does NO memory enforcement on this route (cores are reserved, memory is
# not). Unlike Slurm cgroups, an overrunning job is not killed in isolation —
# it spills into shared node RAM and the kernel OOM killer may take a NEIGHBOUR
# or the snakemake process itself. So do not pack the node to 128/128.
#
# Phase 1 (smoke, 1 rome node = 128 cores): 14 x 9 = 126 cores. Worst case is
#   14 concurrent acapulco jobs; leaves a margin against a single overrunner.
# Phase 3 (production, -N 8 = 1024 cores): jobs = 112.
# Do NOT also pass --jobs on the command line: the CLI value overrides this.
#
# Two job shapes coexist in one invocation.
#   acapulco_segmentation : 9 cores  -> 2048/9 = 227 concurrent
#   group "subject_post"  : ~6 cores -> 2048/6 = 341 concurrent
#     (6 = the widest layer of the per-subject sub-DAG, the sigma fan-out;
#      a group's cores are DERIVED from its members, so there is no set-threads
#      entry for it and none is possible.)
# 300 keeps a queue in front of flux without over-committing on the first
# production run: 341 groups x 6 processes = 128 python processes per rome node,
# all importing soma/scipy off workflash. Raise once that is observed to be fine.
jobs: 340

# --- resources --------------------------------------------------------------
# List syntax, matching the existing tgcc profile.
# mem_mb is IGNORED by this route — Flux does no memory placement, so memory is
# bought via `threads` (see set-threads below). Kept here for documentation and
# for rollback to the tgcc profile.
default-resources:
  - mem_mb=1781
  - runtime=600
  - cores=1

# --- memory -> cores translation  (THE load-bearing block on this route) ----
# rome gives 1781 Mo per core, so:  threads = ceil(mem_mb / 1781)
# Any rule with a set-resources mem_mb entry MUST get a matching set-threads
# entry, or it submits with -c1 and is capped at 1781 Mo.
#
#   acapulco_segmentation: 14248 Mo -> ceil(14248/1781) = 8 cores exactly.
#   Set to 9 (= 16029 Mo) deliberately: 14248 was itself raised after real OOMs
#   at 8095, and Flux will not contain an overrun to the offending job.
set-threads:
  acapulco_segmentation: 9

# Retained so the memory requirement stays documented in one place, and so this
# profile can be diffed against profiles/tgcc. Ignored under Flux.
set-resources:
  acapulco_segmentation:
    mem_mb: 14248

# --- dispatch rate ----------------------------------------------------------
# These are upper-bound RATE LIMITERS, not parallelizers -- they were useless
# while each status check cost ~1.5 s of subprocess (the real constraint). They
# only start to matter now that flux_status_cached.sh brings a check down to a
# few ms. Set here rather than on the CLI so the sub_file stays thin.
max-jobs-per-second: 50
max-status-checks-per-second: 50

# --- robustness -------------------------------------------------------------
latency-wait: 60          # shared FS metadata lag on workflash; raise if
                          # "missing output files" appear on jobs that succeeded
                          # (grouping cuts the number of these checks ~20x, so
                          #  this can likely drop to 30 once observed)
scheduler: greedy
keep-going: true
rerun-incomplete: true    # needed to resume after an allocation wall-clock kill
retries: 2                # NB a group job retry re-runs the whole ~39-rule
                          # subject chain, not one rule
printshellcmds: true

# --- NOT set, deliberately --------------------------------------------------
# use-envmodules: the existing tgcc profile does not set it, so no rule relies
#   on `envmodules:`. That removes the "does `module` survive into a
#   Flux-launched jobscript" risk entirely — nothing to verify.
# use-conda: the env comes from `module load snakemake/9.14.0`.
