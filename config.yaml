# ------------------------------------------
# Pipeline parameters
# ------------------------------------------

# Environement management
execution : "local"

environments :
  module_tgcc : "morphologist/5.2"
  pixi_env : "morphologist"

## Inputs
subject_list : "subjects.txt" # Subject list file
raw_data : "absolute_path_to_data"
data_structure : "relative_path_of_individual_subject_nifti"

## Results
output_folder : "path_to_save_outputs"

## Dataset 
dataset_name : "UKBiobank" #Name of the dataset of raw data

# ------------------------------------------
# Pipeline parameters
# ------------------------------------------

## Dataset
dataset :
  name : "UKBiobank" #Dataset name at the end of the pipeline
  version : "too_add" # Version of the dataset

## Acapulco parameters
segmentation_params :
  method : "kki"

## Substructures' masks paths
substructures_masks : #Can take a list of substructure's mask
  vermis_mask : "path_to_the_vermis_mask"

cerebellum_atlas_path_mask : "path_to_cerebellum_atlas_mask"

dilatation_cerebellum_atlas_mask : 10 #voxels
dilatation_substructure : 5 #voxels

## Persistence settings : 

sigmas : [1, 2, 3]
min_quantile : 0.01
max_quantile : 0.3
threshold_persistence : 3
